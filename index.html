<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Safe Truck Parking Hub</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #121212; color: #fff; }
        #header { padding: 15px; background: #1f1f1f; text-align: center; border-bottom: 2px solid #333; }
        #controls { padding: 10px; background: #181818; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; border-bottom: 1px solid #333; }
        #map { height: 58vh; width: 100%; }
        #footer { padding: 10px; text-align: center; background: #1f1f1f; border-top: 2px solid #333; }
        .btn { background: #4CAF50; color: #fff; padding: 8px 16px; text-decoration: none; font-weight: bold; border-radius: 5px; display: inline-block; font-size: 14px; }
        input, select { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; font-size: 14px; }
        .distance-label {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #4CAF50;
            color: #4CAF50;
            padding: 2px 6px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            white-space: nowrap;
        }
        .gps-btn {
            background: #4CAF50;
            color: white;
            padding: 6px 12px;
            text-decoration: none;
            border-radius: 4px;
            display: inline-block;
            margin-top: 8px;
            font-weight: bold;
            font-size: 13px;
        }
        .fav-btn {
            background: #ff9800;
            color: black;
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 4px;
            display: inline-block;
            margin-top: 8px;
            margin-left: 5px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            border: none;
        }
        #trial-banner { background: #4CAF50; color: #fff; padding: 8px; font-weight: bold; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

    <div id="trial-banner">🎉 Active Free Trial: 7 Days Left to Unlock All Parking Spots!</div>

    <div id="header">
        <h2>US Safe Truck Parking Hub</h2>
        <p>The #1 App for Truck Drivers in the USA</p>
    </div>

    <div id="controls">
        <input type="text" id="citySearch" placeholder="Search US City (e.g. Chicago)...">
        <button class="btn" onclick="searchCity()">Search City</button>
        
        <select id="parkingFilter" onchange="filterParking()">
            <option value="all">All Parking Types</option>
            <option value="rest_area">Official Rest Areas</option>
            <option value="commercial">Commercial Truck Stops</option>
        </select>

        <button class="btn" style="background:#ff9800; color:#000;" onclick="showFavorites()">⭐ View Favorites</button>
    </div>

    <div id="map"></div>

    <div id="footer">
        <p style="margin: 0 0 5px 0; font-size: 13px; color: #bbb;">Enjoy your 1-week free trial period</p>
        <a href="#" class="btn">Upgrade Account ($19.99/mo)</a>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([36.0726, -79.7920], 10);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var markersLayer = L.layerGroup().addTo(map);
        var allParkingSpots = [
            { lat: 36.0983, lon: -79.9572, name: "Pilot Travel Center #352 (I-40)", type: "commercial", dist: 8.4 },
            { lat: 36.1045, lon: -79.5210, name: "Love's Travel Stop #489 (I-85)", type: "commercial", dist: 14.2 },
            { lat: 36.0321, lon: -80.1245, name: "I-40 Official State Rest Area", type: "rest_area", dist: 11.5 },
            { lat: 35.8456, lon: -79.8123, name: "I-85 North Official Rest Area", type: "rest_area", dist: 16.9 }
        ];
        var favorites = JSON.parse(localStorage.getItem('truck_favs')) || [];

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                var userLat = position.coords.latitude;
                var userLon = position.coords.longitude;
                map.setView([userLat, userLon], 11);

                L.marker([userLat, userLon]).addTo(map)
                    .bindPopup("<b>📍 Your Live Location</b>").openPopup();
            }, function(error) {
                console.log("Geolocation error");
            }, { enableHighAccuracy: true });
        }

        function renderMarkers(spots) {
            markersLayer.clearLayers();
            spots.forEach(spot => {
                var marker = L.marker([spot.lat, spot.lon]);

                marker.bindTooltip(spot.dist + " miles", {
                    permanent: true,
                    direction: 'bottom',
                    className: 'distance-label'
                });

                var googleMapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lon}&travelmode=driving`;
                var isFav = favorites.some(f => f.name === spot.name);
                var favText = isFav ? "★ Favorited" : "☆ Save Favorite";

                marker.bindPopup(
                    `<b>🚚 ${spot.name}</b><br>` +
                    `Distance: ${spot.dist} miles<br>` +
                    `<span style='color: #4CAF50; font-weight: bold;'>Safe & Legal Truck Parking</span><br>` +
                    `<a href='${googleMapsUrl}' target='_blank' class='gps-btn'>Start GPS ➔</a>` +
                    `<button class='fav-btn' onclick='toggleFav("${spot.name}", ${spot.lat}, ${spot.lon}, ${spot.dist}, "${spot.type}")'>${favText}</button>`
                );

                markersLayer.addLayer(marker);
            });
        }

        renderMarkers(allParkingSpots);

        function filterParking() {
            var val = document.getElementById('parkingFilter').value;
            if (val === 'all') {
                renderMarkers(allParkingSpots);
            } else {
                var filtered = allParkingSpots.filter(s => s.type === val);
                renderMarkers(filtered);
            }
        }

        function searchCity() {
            var query = document.getElementById('citySearch').value.trim();
            if (!query) return;

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', USA')}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        var lat = parseFloat(data[0].lat);
                        var lon = parseFloat(data[0].lon);
                        map.setView([lat, lon], 11);
                        
                        var dynamicSpots = [
                            { lat: lat + 0.05, lon: lon + 0.05, name: query + " Commercial Truck Stop", type: "commercial", dist: 4.5 },
                            { lat: lat - 0.05, lon: lon - 0.05, name: query + " Official Rest Area", type: "rest_area", dist: 9.1 }
                        ];
                        renderMarkers(dynamicSpots);
                    } else {
                        alert("City not found. Please try another US city.");
                    }
                })
                .catch(err => console.log(err));
        }

        function toggleFav(name, lat, lon, dist, type) {
            var index = favorites.findIndex(f => f.name === name);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push({ name, lat, lon, dist, type });
            }
            localStorage.setItem('truck_favs', JSON.stringify(favorites));
            renderMarkers(allParkingSpots);
            alert("Favorites updated!");
        }

        function showFavorites() {
            if (favorites.length === 0) {
                alert("No saved favorite spots yet.");
                return;
            }
            renderMarkers(favorites);
        }
    </script>

</body>
</html>
